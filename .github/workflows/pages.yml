# Builds app/data/*.json from data/*.csv, runs the acceptance tests, stamps
# the commit onto every URL the page loads (scripts/stamp.mjs, so one deploy's
# files never mix with another's in a browser cache), and publishes the
# stamped copy to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run data
      - run: npm test
      - run: node scripts/stamp.mjs ${GITHUB_SHA::12}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
